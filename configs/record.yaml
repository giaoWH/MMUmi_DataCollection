# Edit this file and run:
#   python scripts/sdk_record.py
# Optional first-time serial port setup:
#   python scripts/sdk_discover_ports.py

output_root: sessions
sensor_source: real
align_rate_hz: 30.0
duration_sec: 2.0
max_frame_age: 0.2
enable_ft: true
enable_imu: true
enable_realsense: false
enable_motors: true
enable_microphone: true
enable_camera: true
enable_gelsight: false
enable_trajectory: false
ft:
  name: ft
  port: /dev/ttyACM0
  baudrate: 115200
  calibration_duration: 3.0
imu:
  name: imu
  port: /dev/ttyUSB0
  baudrate: 115200
realsense:
  name: realsense
  serial_number: null
  enable_color: true
  enable_depth: true
  enable_ir1: false
  enable_ir2: false
  enable_imu: false
  width: 640
  height: 480
  fps: 30
  color:
    width: 640
    height: 480
    fps: 30
  depth:
    width: 640
    height: 480
    fps: 30
  infrared:
    width: 640
    height: 480
    fps: 30
  imu:
    accel_fps: 250
    gyro_fps: 200
    max_samples_per_frame: 512
  derived:
    enable_aligned_depth_to_color: false
    enable_pointcloud: false
    pointcloud_colored: true
motors:
  name: motors
  port: /dev/ttyACM1
  baudrate: 115200
  calibration_duration: 3.0
microphone:
  name: microphone
  channels: 1
  rate: 48000
  chunk: 1024
  device_index: 0
camera:
  name: camera
  device_index: 0
  width: 640
  height: 480
  fps: 30
  flip_vertical: false
gelsight:
  name: gelsight
  device_index: 0
  width: 640
  height: 480
  fps: 30
gravity_compensation:
  enabled: false
  mass: 0.25
  com:
  - 0.0
  - 0.0
  - 0.0
  stabilization_sec: 2.0
  calibration_duration_sec: 3.0
  minimum_samples: 10
trajectory:
  command: null
  mode: rgbd_inertial
  output_mode: stdout_jsonl
  source_name: orbslam3
  bundle_dir: null
  env: {}
