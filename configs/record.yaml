# Activate environment and record:
#   conda activate umi_sdk
#   python scripts/sdk_record.py
# Optional first-time device discovery:
#   python scripts/sdk_discover_ports.py
# Offline trajectory processing on PC:
#   python scripts/sdk_process_trajectory.py <session_dir> --config configs/record.yaml

output_root: /mnt/m2ssd/umi-data/sessions
sensor_source: real
align_rate_hz: 30.0
duration_sec: 10.0
interactive: true
startup_discard_sec: 1
max_frame_age: 0.2
enable_ft: true
enable_imu: true
enable_realsense: true
enable_motors: true
enable_microphone: true
enable_camera: true
enable_gelsight: true
ft:
  name: ft
  port: /dev/ttyACM2
  baudrate: 115200
  calibration_duration: 3.0
  enable_torque: true
imu:
  name: imu
  port: /dev/ttyUSB1
  baudrate: 115200
realsense:
  name: realsense
  serial_number: null
  enable_color: false
  enable_depth: true
  enable_ir1: true
  enable_ir2: true
  enable_imu: true
  frame_queue_size: 128
  width: 640
  height: 480
  fps: 30
  color:
    width: 640
    height: 480
    fps: 30
  depth:
    width: 640
    height: 480
    fps: 30
  infrared:
    width: 640
    height: 480
    fps: 30
  imu:
    accel_fps: 200
    gyro_fps: 200
    max_samples_per_frame: 512
  derived:
    enable_aligned_depth_to_color: false
    enable_pointcloud: false
    pointcloud_colored: false
motors:
  name: motors
  port: /dev/ttyACM3
  baudrate: 115200
  calibration_duration: 3.0
  enable_motor_1: false
  enable_motor_2: true
microphone:
  name: microphone
  channels: 1
  rate: 48000
  chunk: 1024
  device_index: null
camera:
  name: camera
  device_index: 6
  width: 640
  height: 480
  fps: 30
  flip_horizontal: true
  flip_vertical: true
  frame_queue_size: 128
gelsight:
  name: gelsight
  device_index: 9
  width: 320
  height: 240
  fps: 25
  frame_queue_size: 128
gravity_compensation:
  enabled: false
  mass: 0.25
  com:
  - 0.0
  - 0.0
  - 0.0
  stabilization_sec: 2.0
  calibration_duration_sec: 3.0
  minimum_samples: 10
trajectory:
  command: null
  mode: stereo_inertial
  source_name: orbslam3
  bundle_dir: null
  env: {}
trajectory_qc:
  enabled: true
  output_dir: quality
  output_filename: trajectory_qc.json
  thresholds:
    min_trajectory_coverage_ratio: 0.95
    min_action_eligible_ratio: 0.9
    max_fail_step_ratio: 0.1
    max_translation_delta_m: 0.15
    max_rotation_delta_deg: 45.0
    max_translation_speed_mps: 1.0
    max_rotation_speed_degps: 360.0
    max_translation_accel_mps2: 10.0
    max_rotation_accel_degps2: 2000.0
