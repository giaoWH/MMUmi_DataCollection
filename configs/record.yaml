# Edit this file and run:
#   python scripts/sdk_record.py
# Optional first-time device discovery:
#   python scripts/sdk_discover_ports.py

output_root: /mnt/m2ssd/umi-data/sessions
sensor_source: real
align_rate_hz: 30.0
duration_sec: 10.0
startup_discard_sec: 1
max_frame_age: 0.2
enable_ft: true
enable_imu: false
enable_realsense: true
enable_motors: true
enable_microphone: true
enable_camera: true
enable_gelsight: true
enable_trajectory: false
ft:
  name: ft
  port: /dev/ttyACM0
  baudrate: 115200
  calibration_duration: 3.0
  enable_torque: false
imu:
  name: imu
  port: /dev/ttyUSB0
  baudrate: 115200
realsense:
  name: realsense
  serial_number: '420122071588'
  enable_color: true
  enable_depth: true
  enable_ir1: false
  enable_ir2: false
  enable_imu: false
  frame_queue_size: 128
  width: 640
  height: 480
  fps: 30
  color:
    width: 640
    height: 480
    fps: 30
  depth:
    width: 640
    height: 480
    fps: 30
  infrared:
    width: 640
    height: 480
    fps: 30
  imu:
    accel_fps: 200
    gyro_fps: 200
    max_samples_per_frame: 512
  derived:
    enable_aligned_depth_to_color: false
    enable_pointcloud: false
    pointcloud_colored: false
motors:
  name: motors
  port: /dev/ttyACM1
  baudrate: 115200
  calibration_duration: 3.0
  enable_motor_1: true
  enable_motor_2: false
microphone:
  name: microphone
  channels: 1
  rate: 48000
  chunk: 1024
  device_index: 0
camera:
  name: camera
  device_index: 2
  width: 640
  height: 480
  fps: 30
  flip_horizontal: true
  flip_vertical: true
  frame_queue_size: 128
gelsight:
  name: gelsight
  device_index: 0
  width: 320
  height: 240
  fps: 25
  frame_queue_size: 128
gravity_compensation:
  enabled: false
  mass: 0.25
  com:
  - 0.0
  - 0.0
  - 0.0
  stabilization_sec: 2.0
  calibration_duration_sec: 3.0
  minimum_samples: 10
trajectory:
  command: null
  mode: rgbd_inertial
  output_mode: stdout_jsonl
  source_name: orbslam3
  bundle_dir: null
  env: {}
